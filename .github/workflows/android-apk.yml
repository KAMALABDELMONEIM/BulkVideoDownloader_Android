name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.py'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev liblzma-dev cmake automake

      - name: Remove runner Android variables that can override Buildozer
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"
          for var in ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME ANDROIDSDK ANDROIDNDK ANDROIDAPI ANDROIDMINAPI; do
            echo "$var=" >> "$GITHUB_ENV"
          done

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Verify source
        run: |
          python -m py_compile main.py downloader.py android_storage.py ffmpeg_manager.py
          python tests_smoke.py

      - name: Clear stale Android build state
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android

      - name: Build debug APK
        run: |
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Show APK output
        if: success()
        run: |
          find bin -maxdepth 1 -type f -name '*.apk' -print -ls

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-video-downloader-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: buildozer-build.log
          if-no-files-found: warn
